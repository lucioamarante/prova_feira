{% load static %}

<footer class="footer py-4 border-top border-dark-light mt-5" style="background-color: #0b0f19;">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        
        <!-- Lado Esquerdo: Marca e Citação (UI/UX: Alinhamento vertical focado no bloco) -->
        <div class="text-center text-md-start">
            <h6 class="m-0 text-white fw-bold tracking-tight">
                Box Fácil - Feira dos Goianos
                <span class="text-white mx-1" style="opacity: 0.85;">®</span> <span class="text-secondary-custom">2026</span>
            </h6>
            <p class="m-0 text-secondary mt-1 lh-sm quote-text">
                "Encontrando com facilidade!" — <span class="text-white-50">Sua Loja, Box ou Galpão</span>
            </p>
        </div>

        <!-- Lado Direito: Redes Sociais (UI/UX: Alinhamento centralizado com o container) -->
        <div class="d-flex justify-content-center align-items-center gap-3 social-container">
          
            <!-- LinkedIn -->
            <a href="https://linkedin.com" target="_blank" rel="noopener" class="text-secondary social-link" title="LinkedIn">
                <i class="fa-brands fa-linkedin-in fs-5"></i>
            </a>
            <!-- GitHub -->
            <a href="https://github.com" target="_blank" rel="noopener" class="text-secondary social-link" title="GitHub">
                <i class="fa-brands fa-github fs-5"></i>
            </a>
            <!-- Instagram -->
            <a href="https://instagram.com" target="_blank" rel="noopener" class="text-secondary social-link" title="Instagram">
                <i class="fa-brands fa-instagram fs-5"></i>
            </a>
            <!-- Facebook -->
            <a href="https://facebook.com" target="_blank" rel="noopener" class="text-secondary social-link" title="Facebook">
                <i class="fa-brands fa-facebook-f fs-5"></i>
            </a>
        </div>

    </div>
</footer>
